name: Publish Wimeloo first APK release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: wimeloo-release-v1.2.0
  cancel-in-progress: false
jobs:
  publish-verified-apk:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI test environment
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test game, state, touch controls and dev mode
        run: |
          npm test
          npm run test:world
          npm run test:minigames
          npm run test:care
      - name: Reconstruct APK and compare complete game sources
        run: python3 tools/reassemble_apk.py
      - name: Download official Android tools (pinned checksums)
        run: python3 android/fetch-toolchain.py
      - name: Verify Android APK signing, version and certificate
        shell: bash
        run: |
          set -euo pipefail
          java -jar ../toolchain/build-tools/35.0.0/lib/apksigner.jar verify --verbose --print-certs dist/Wimeloo-1.2.0.apk | tee dist/signature-verification.txt
          python3 tools/verify_signer.py dist/signature-verification.txt
          ../toolchain/build-tools/35.0.0/aapt2 dump badging dist/Wimeloo-1.2.0.apk | tee dist/badging.txt
          grep -q "package: name='de.sternenbaby.app' versionCode='4' versionName='1.2.0'" dist/badging.txt
          grep -q "application-label:'Wimeloo'" dist/badging.txt
          ../toolchain/build-tools/35.0.0/zipalign -c -P 16 4 dist/Wimeloo-1.2.0.apk
      - name: Upload validated APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wimeloo-1.2.0
          path: dist/Wimeloo-1.2.0.apk
      - name: Create first public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo 'v1.2.0 already exists, no overwrite'; exit 0
          fi
          gh release create v1.2.0 dist/Wimeloo-1.2.0.apk \
            --target "$GITHUB_SHA" \
            --title 'Wimeloo 1.2.0' \
            --notes 'Erstes Wimeloo-Release. Offline-Spielwelt mit sechs Lernspielen und optionalem lokalem Browser-Entwicklermodus. Update-kompatibel zu Sternenbaby 1.1.0 dank identischer Android-Paketkennung und Signierzertifikat.'
