name: Verify Wimeloo
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:world
      - run: npm run test:minigames
      - run: npm run test:care
      - name: No secrets in tracked files
        run: |
          if git ls-files | grep -E '(^toolchain/|(^|/)build-state/|\.(p12|jks|keystore|password)$)'; then
            echo 'Private signing files must not be committed'; exit 1
          fi
  android-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 android/fetch-toolchain.py
      - run: python3 android/build.py --check-native
